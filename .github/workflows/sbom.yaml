name: SBOM manual upload
on:
  workflow_dispatch: # can be manually dispatched under GitHub's "Actions" tab 
    inputs:
      platform:
        description: Docker platform
        required: true
        default: linux/amd64
        type: choice
        options: 
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/386
          - linux/ppc64le
          - linux/riscv64
          - linux/s390x

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: write
    steps:     
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM with Syft from latest AMD64 image
        run: syft scan registry:${{ vars.DOCKERHUB_REPO }}:latest --platform ${{ inputs.platform }} --select-catalogers "+sbom-cataloger" --output spdx-json=docker.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-sbom
          path: docker.spdx.json

      - name: Upload SBOM to GitHub dependency submission API
        uses: advanced-security/spdx-dependency-submission-action@169d22427d74f3faf93504e70b03eede8dab272a # v0.2.0
